name: DevSecOps Pipeline (Shift-Left)

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/devsecops.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: todo-app-backend
  ECR_FRONTEND: todo-app-frontend
  EKS_CLUSTER: todo-app-cluster

jobs:
  # 1. IaC Scan (Checkov)
  iac-security-scan:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true 

  # 2. SAST & SCA
  sast-sca-analysis:
    name: Static Code & Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: SCA - Backend Dependency Scan
        working-directory: ./app/backend
        run: npm audit --audit-level=high || true
        
      - name: SCA - Frontend Dependency Scan
        working-directory: ./app/frontend
        run: npm audit --audit-level=high || true

  # 🛡️ 3. Container Security & ECR Push 
  image-scan-and-push:
    name: Docker Build, Trivy Scan & Push ECR
    needs: [iac-security-scan, sast-sca-analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- BUILD VÀ SCAN BACKEND ---
      - name: Build Backend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: docker build -t $REGISTRY/$ECR_BACKEND:$COMMIT_SHA ./app/backend

      - name: Scan Backend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL' 
          exit-code: '0'       
          ignore-unfixed: true

      - name: Push Backend Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: docker push $REGISTRY/$ECR_BACKEND:$COMMIT_SHA

      # --- BUILD VÀ SCAN FRONTEND ---
      - name: Build Frontend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: docker build -t $REGISTRY/$ECR_FRONTEND:$COMMIT_SHA ./app/frontend

      - name: Scan Frontend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

      - name: Push Frontend Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: docker push $REGISTRY/$ECR_FRONTEND:$COMMIT_SHA

  # 4. EKS Deploy
  deploy-to-eks:
    name: Continuous Deployment to K8s
    needs: image-scan-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Update Manifests and Apply
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i "s|image: .*todo-app-backend:.*|image: 222634368199.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_BACKEND:$COMMIT_SHA|g" k8s/deployment-backend.yaml
          sed -i "s|image: .*todo-app-frontend:.*|image: 222634368199.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_FRONTEND:$COMMIT_SHA|g" k8s/deployment-frontend.yaml
          
          kubectl apply -f k8s/