grafana:
  adminPassword: "AdminPasswordSecure123!" # Đặt pass đăng nhập Grafana
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    # Bật tính năng tự cào các Pod có gắn prometheus.io/scrape
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  enabled: false # Tắt nếu chưa cần gửi cảnh báo qua Slack/Email để tiết kiệm RAM node